worker_processes 1;

error_log /tmp/cn-nginx-error.log notice;
pid /tmp/cn-nginx.pid;

events {
    worker_connections 128;
}

http {
    default_type application/octet-stream;

    access_log /tmp/cn-nginx-access.log;

    upstream backend_pool {
        server 10.7.12.140:3001 max_fails=1 fail_timeout=5s;
        server 10.7.26.0:3002 max_fails=1 fail_timeout=5s;
    }

    server {
    listen 10.7.2.253:8443 ssl;
    server_name app.team1.test api.team1.test;

    ssl_certificate ../tls/team1-server.crt;
    ssl_certificate_key ../tls/team1-server.key;

    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://backend_pool;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }
}
}
